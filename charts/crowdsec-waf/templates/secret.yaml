{{- include "crowdsec-waf.validate" . }}
{{- if .Values.secrets.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.name }}
{{- $key := randAlphaNum 48 }}
{{- if and $existing $existing.data }}
{{- $old := get $existing.data .Values.secrets.bouncerKeyKey | default "" }}
{{- if $old }}{{ $key = $old | b64dec }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "crowdsec-waf.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.secrets.bouncerKeyKey }}: {{ $key | quote }}
{{- end }}
